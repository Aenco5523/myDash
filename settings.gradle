pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

rootProject.name = 'myDash'

include 'mydash-api'
include 'mydash-core'
include 'platforms:neoforge-1.21.1'
include 'platforms:fabric-1.21.1'
