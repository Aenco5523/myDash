name: Build myDash

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mydash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds intentionally run only on the Windows self-hosted runner.
# The runner's persistent ~/.gradle directory is the dependency, mapping,
# wrapper/distribution and Gradle build cache. No GitHub cache/artifact
# storage is used for normal builds.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: pwsh
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Write-Host "Removing corrupted Maven toolchains.xml containing NUL bytes."
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-provider: external
          validate-wrappers: false

      - name: Show local Gradle cache
        shell: pwsh
        run: |
          Write-Host "GRADLE_USER_HOME=$HOME\.gradle"
          if (Test-Path (Join-Path $HOME ".gradle\caches")) {
            Write-Host "Existing Gradle caches found."
          } else {
            Write-Host "Cold Gradle cache; first build will populate it."
          }

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: pwsh
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-provider: external
          validate-wrappers: false

      - name: Build all release JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.jar
            platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.jar
