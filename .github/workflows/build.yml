name: Build myDash

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Every build and release job runs only on self-hosted runners.
# Gradle's persistent ~/.gradle directory is reused as the local dependency,
# Minecraft mapping and build cache. GitHub Actions cache storage is disabled.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: true

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: true

      - name: Build all release JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.0.jar
            platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.0.jar
