name: Build myDash

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle ${{ matrix.task }} --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build release JARs
        run: gradle buildSupported --stacktrace

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload JARs directly to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}"             platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.0.jar             platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.0.jar             --clobber
