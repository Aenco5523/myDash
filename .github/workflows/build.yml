name: Build myDash

on:
  push:
    branches: [ main, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Build exclusively on the owner's self-hosted runner.
# The runner's persistent ~/.gradle directory is intentionally reused as the
# dependency/mapping cache instead of GitHub Actions artifact/cache storage.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          # Self-hosted runners keep ~/.gradle between jobs/runs.
          # Avoid GitHub-hosted cache quota and use the persistent local cache.
          cache-disabled: true
          validate-wrappers: true

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: true

      - name: Build all release JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Upload JARs directly to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}"             platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.0.jar             platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.0.jar             --clobber
