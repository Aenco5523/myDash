name: Build myDash

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mydash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All builds run only on self-hosted Windows runners.
# ~/.gradle is deliberately persistent and acts as the local dependency,
# Minecraft mapping, Loom/ForgeGradle transform and Gradle build cache.
jobs:
  modern:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build
          - name: Paper 1.21.1
            task: :platforms:paper-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  standalone:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.16.5
            path: legacy/forge-1.16.5
            java: "8"
            gradle: "7.6.4"
          - name: Fabric 1.16.5
            path: legacy/fabric-1.16.5
            java: "21"
            gradle: "8.8"
          - name: Paper 1.16.5
            path: legacy/paper-1.16.5
            java: "16"
            gradle: "7.6.4"

          - name: Forge 1.18.2
            path: legacy/forge-1.18.2
            java: "17"
            gradle: "7.6.4"
          - name: Fabric 1.18.2
            path: legacy/fabric-1.18.2
            java: "21"
            gradle: "8.8"
          - name: Paper 1.18.2
            path: legacy/paper-1.18.2
            java: "17"
            gradle: "7.6.4"

          - name: Forge 1.20.1
            path: legacy/forge-1.20.1
            java: "17"
            gradle: "8.8"
          - name: Fabric 1.20.1
            path: legacy/fabric-1.20.1
            java: "21"
            gradle: "8.8"
          - name: Paper 1.20.1
            path: legacy/paper-1.20.1
            java: "21"
            gradle: "8.8"

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-disabled: true
          validate-wrappers: false

      - name: Build ${{ matrix.name }}
        run: gradle -p ${{ matrix.path }} build --build-cache --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [modern, standalone]
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build modern JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Build Fabric standalone JARs
        shell: powershell
        run: |
          gradle -p legacy/fabric-1.16.5 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/fabric-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/fabric-1.20.1 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/paper-1.20.1 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Switch to Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build 1.18.2 Forge and Paper
        shell: powershell
        run: |
          gradle -p legacy/forge-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/paper-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Gradle 8.8 for Forge 1.20.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Forge 1.20.1
        run: gradle -p legacy/forge-1.20.1 build --build-cache --stacktrace

      - name: Switch to Java 16
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up Gradle 7.6.4 for Paper 1.16.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Paper 1.16.5
        run: gradle -p legacy/paper-1.16.5 build --build-cache --stacktrace

      - name: Switch to Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Build Forge 1.16.5
        run: gradle -p legacy/forge-1.16.5 build --build-cache --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.jar
            platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.jar
            platforms/paper-1.21.1/build/libs/myDash-paper-1.21.1-v2.1.jar

            legacy/forge-1.16.5/build/libs/myDash-forge-1.16.5-v2.1.jar
            legacy/fabric-1.16.5/build/libs/myDash-fabric-1.16.5-v2.1.jar
            legacy/paper-1.16.5/build/libs/myDash-paper-1.16.5-v2.1.jar

            legacy/forge-1.18.2/build/libs/myDash-forge-1.18.2-v2.1.jar
            legacy/fabric-1.18.2/build/libs/myDash-fabric-1.18.2-v2.1.jar
            legacy/paper-1.18.2/build/libs/myDash-paper-1.18.2-v2.1.jar

            legacy/forge-1.20.1/build/libs/myDash-forge-1.20.1-v2.1.jar
            legacy/fabric-1.20.1/build/libs/myDash-fabric-1.20.1-v2.1.jar
            legacy/paper-1.20.1/build/libs/myDash-paper-1.20.1-v2.1.jar
