name: Build myDash

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mydash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Builds intentionally run only on the Windows self-hosted runner.
# The runner's persistent ~/.gradle directory is reused for dependencies,
# Minecraft mappings, Loom/ForgeGradle transforms and Gradle build-cache data.
# GitHub-hosted cache/artifact storage is not used for normal builds.
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build
          - name: Paper 1.21.1
            task: :platforms:paper-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Write-Host "Removing corrupted Maven toolchains.xml containing NUL bytes."
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Show local Gradle cache
        shell: powershell
        run: |
          Write-Host "GRADLE_USER_HOME=$HOME\.gradle"
          if (Test-Path (Join-Path $HOME ".gradle\caches")) {
            Write-Host "Existing Gradle caches found."
          } else {
            Write-Host "Cold Gradle cache; first build will populate it."
          }

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  legacy-forge:
    name: Forge 1.16.5
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up legacy Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Forge 1.16.5
        run: gradle -p legacy/forge-1.16.5 build --build-cache --stacktrace

  legacy-fabric:
    name: Fabric 1.16.5
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Fabric Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Fabric 1.16.5
        run: gradle -p legacy/fabric-1.16.5 build --build-cache --stacktrace

  legacy-paper:
    name: Paper 1.16.5
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 16
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up legacy Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Paper 1.16.5
        run: gradle -p legacy/paper-1.16.5 build --build-cache --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, legacy-forge, legacy-fabric, legacy-paper]
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build modern release JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Build Fabric 1.16.5 release JAR
        run: gradle -p legacy/fabric-1.16.5 build --build-cache --stacktrace

      - name: Switch to Java 16 for Paper 1.16.5
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Paper 1.16.5 release JAR
        run: gradle -p legacy/paper-1.16.5 build --build-cache --stacktrace

      - name: Switch to Java 8 for Forge 1.16.5
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Build Forge 1.16.5 release JAR
        run: gradle -p legacy/forge-1.16.5 build --build-cache --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.jar
            platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.jar
            platforms/paper-1.21.1/build/libs/myDash-paper-1.21.1-v2.1.jar
            legacy/forge-1.16.5/build/libs/myDash-forge-1.16.5-v2.1.jar
            legacy/fabric-1.16.5/build/libs/myDash-fabric-1.16.5-v2.1.jar
            legacy/paper-1.16.5/build/libs/myDash-paper-1.16.5-v2.1.jar
