name: Build myDash

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mydash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All builds run only on self-hosted Windows runners.
# ~/.gradle is deliberately persistent and acts as the local dependency,
# Minecraft mapping, Loom/ForgeGradle transform and Gradle build cache.
jobs:
  changes:
    name: Detect build scope
    runs-on: [self-hosted, Windows, X64]
    outputs:
      modern: ${{ steps.scope.outputs.modern }}
      standalone: ${{ steps.scope.outputs.standalone }}
      calver: ${{ steps.scope.outputs.calver }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed target groups
        id: scope
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "modern=true" >> $env:GITHUB_OUTPUT
            "standalone=true" >> $env:GITHUB_OUTPUT
            "calver=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $head = "${{ github.event.pull_request.head.sha }}"
          $base = git rev-parse "$head~2"
          $files = git diff --name-only $base $head

          $modern = $false
          $standalone = $false
          $calver = $false

          foreach ($file in $files) {
            if ($file -match '^(mydash-api/|mydash-core/)') {
              $modern = $true
              $standalone = $true
              $calver = $true
              continue
            }

            if ($file -match '^(platforms/|build\.gradle$|settings\.gradle$|gradle\.properties$)') {
              $modern = $true
            }

            if ($file -match '^legacy/') {
              $standalone = $true
            }

            if ($file -match '^calver/') {
              $calver = $true
            }

            if ($file -eq '.github/workflows/build.yml') {
              $calver = $true
            }
          }

          "modern=$($modern.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "standalone=$($standalone.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "calver=$($calver.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  modern:
    needs: changes
    if: needs.changes.outputs.modern == 'true'
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NeoForge 1.21.1
            task: :platforms:neoforge-1.21.1:build
          - name: Fabric 1.21.1
            task: :platforms:fabric-1.21.1:build
          - name: Paper 1.21.1
            task: :platforms:paper-1.21.1:build

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build
        run: gradle ${{ matrix.task }} --build-cache --parallel --stacktrace

  standalone:
    needs: changes
    if: needs.changes.outputs.standalone == 'true'
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.16.5
            path: legacy/forge-1.16.5
            java: "8"
            gradle: "7.6.4"
          - name: Fabric 1.16.5
            path: legacy/fabric-1.16.5
            java: "21"
            gradle: "8.8"
          - name: Paper 1.16.5
            path: legacy/paper-1.16.5
            java: "16"
            gradle: "7.6.4"

          - name: Forge 1.18.2
            path: legacy/forge-1.18.2
            java: "17"
            gradle: "7.6.4"
          - name: Fabric 1.18.2
            path: legacy/fabric-1.18.2
            java: "21"
            gradle: "8.8"
          - name: Paper 1.18.2
            path: legacy/paper-1.18.2
            java: "17"
            gradle: "7.6.4"

          - name: Forge 1.20.1
            path: legacy/forge-1.20.1
            java: "17"
            gradle: "8.8"
          - name: Fabric 1.20.1
            path: legacy/fabric-1.20.1
            java: "21"
            gradle: "8.8"
          - name: Paper 1.20.1
            path: legacy/paper-1.20.1
            java: "21"
            gradle: "8.8"

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-disabled: true
          validate-wrappers: false

      - name: Build ${{ matrix.name }}
        run: gradle -p ${{ matrix.path }} build --build-cache --stacktrace

  calver:
    needs: changes
    if: needs.changes.outputs.calver == 'true'
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Forge 26.1", path: "calver/forge", mc: "26.1" }
          - { name: "Forge 26.2", path: "calver/forge", mc: "26.2" }
          - { name: "Forge 26.3", path: "calver/forge", mc: "26.3" }
          - { name: "NeoForge 26.1", path: "calver/neoforge", mc: "26.1" }
          - { name: "NeoForge 26.2", path: "calver/neoforge", mc: "26.2" }
          - { name: "NeoForge 26.3", path: "calver/neoforge", mc: "26.3" }
          - { name: "Fabric 26.1", path: "calver/fabric", mc: "26.1" }
          - { name: "Fabric 26.2", path: "calver/fabric", mc: "26.2" }
          - { name: "Fabric 26.3", path: "calver/fabric", mc: "26.3" }
          - { name: "Paper 26.1", path: "calver/paper", mc: "26.1" }
          - { name: "Paper 26.2", path: "calver/paper", mc: "26.2" }
          - { name: "Paper 26.3", path: "calver/paper", mc: "26.3" }

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) { Remove-Item $toolchains -Force }
          }

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: true
          validate-wrappers: false

      - name: Build ${{ matrix.name }}
        run: gradle -p ${{ matrix.path }} build -PmcVersion=${{ matrix.mc }} --build-cache --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [modern, standalone, calver]
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted Maven toolchain metadata
        shell: powershell
        run: |
          $toolchains = Join-Path $HOME ".m2\toolchains.xml"
          if (Test-Path $toolchains) {
            $bytes = [System.IO.File]::ReadAllBytes($toolchains)
            if ($bytes -contains 0) {
              Remove-Item $toolchains -Force
            }
          }

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build modern JARs
        run: gradle buildSupported --build-cache --parallel --stacktrace

      - name: Switch to Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0 for 26.x
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-disabled: true
          validate-wrappers: false

      - name: Build CalVer 26.x JARs
        shell: powershell
        run: |
          $targets = @(
            @("calver/forge","26.1"), @("calver/forge","26.2"), @("calver/forge","26.3"),
            @("calver/neoforge","26.1"), @("calver/neoforge","26.2"), @("calver/neoforge","26.3"),
            @("calver/fabric","26.1"), @("calver/fabric","26.2"), @("calver/fabric","26.3"),
            @("calver/paper","26.1"), @("calver/paper","26.2"), @("calver/paper","26.3")
          )
          foreach ($target in $targets) {
            gradle -p $target[0] build "-PmcVersion=$($target[1])" --build-cache --stacktrace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Switch back to Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Fabric standalone JARs
        shell: powershell
        run: |
          gradle -p legacy/fabric-1.16.5 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/fabric-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/fabric-1.20.1 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/paper-1.20.1 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Switch to Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build 1.18.2 Forge and Paper
        shell: powershell
        run: |
          gradle -p legacy/forge-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gradle -p legacy/paper-1.18.2 build --build-cache --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Gradle 8.8 for Forge 1.20.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Forge 1.20.1
        run: gradle -p legacy/forge-1.20.1 build --build-cache --stacktrace

      - name: Switch to Java 16
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "16"

      - name: Set up Gradle 7.6.4 for Paper 1.16.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "7.6.4"
          cache-disabled: true
          validate-wrappers: false

      - name: Build Paper 1.16.5
        run: gradle -p legacy/paper-1.16.5 build --build-cache --stacktrace

      - name: Switch to Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Build Forge 1.16.5
        run: gradle -p legacy/forge-1.16.5 build --build-cache --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            platforms/neoforge-1.21.1/build/libs/myDash-neoforge-1.21.1-v2.1.jar
            platforms/fabric-1.21.1/build/libs/myDash-fabric-1.21.1-v2.1.jar
            platforms/paper-1.21.1/build/libs/myDash-paper-1.21.1-v2.1.jar

            calver/forge/build/libs/myDash-forge-26.1-v2.1.jar
            calver/forge/build/libs/myDash-forge-26.2-v2.1.jar
            calver/forge/build/libs/myDash-forge-26.3-v2.1.jar
            calver/neoforge/build/libs/myDash-neoforge-26.1-v2.1.jar
            calver/neoforge/build/libs/myDash-neoforge-26.2-v2.1.jar
            calver/neoforge/build/libs/myDash-neoforge-26.3-v2.1.jar
            calver/fabric/build/libs/myDash-fabric-26.1-v2.1.jar
            calver/fabric/build/libs/myDash-fabric-26.2-v2.1.jar
            calver/fabric/build/libs/myDash-fabric-26.3-v2.1.jar
            calver/paper/build/libs/myDash-paper-26.1-v2.1.jar
            calver/paper/build/libs/myDash-paper-26.2-v2.1.jar
            calver/paper/build/libs/myDash-paper-26.3-v2.1.jar

            legacy/forge-1.16.5/build/libs/myDash-forge-1.16.5-v2.1.jar
            legacy/fabric-1.16.5/build/libs/myDash-fabric-1.16.5-v2.1.jar
            legacy/paper-1.16.5/build/libs/myDash-paper-1.16.5-v2.1.jar

            legacy/forge-1.18.2/build/libs/myDash-forge-1.18.2-v2.1.jar
            legacy/fabric-1.18.2/build/libs/myDash-fabric-1.18.2-v2.1.jar
            legacy/paper-1.18.2/build/libs/myDash-paper-1.18.2-v2.1.jar

            legacy/forge-1.20.1/build/libs/myDash-forge-1.20.1-v2.1.jar
            legacy/fabric-1.20.1/build/libs/myDash-fabric-1.20.1-v2.1.jar
            legacy/paper-1.20.1/build/libs/myDash-paper-1.20.1-v2.1.jar
