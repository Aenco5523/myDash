plugins {
    id 'fabric-loom' version '1.6.5'
}

group = 'dev.aenco.mydash'
version = 'v2.1'

base {
    archivesName = 'myDash-fabric-1.16.5'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.16.5'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.42.0+1.16'
}

sourceSets {
    main {
        java {
            srcDir '../../mydash-api/src/main/java'
            srcDir '../../mydash-core/src/main/java'
        }
        resources {
            srcDir '../../mydash-core/src/main/resources'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

processResources {
    inputs.property 'version', '2.1'
    filesMatching('fabric.mod.json') {
        expand version: '2.1'
    }
}

tasks.named('remapJar') {
    archiveFileName = 'myDash-fabric-1.16.5-v2.1.jar'
}
